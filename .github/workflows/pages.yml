name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  TZ: UTC
  UV_NO_PROGRESS: "1"

jobs:
  build:
    name: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --frozen --all-extras --all-groups

      - name: Run quality gates
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src/trader_atlas scripts
          uv run pytest -q

      - name: Validate repository inputs
        run: |
          uv run python scripts/validate_repo.py docs
          uv run python scripts/validate_repo.py simulation
          uv run python scripts/validate_repo.py artifacts

      - name: Build documentation strictly
        run: uv run mkdocs build --strict

      - name: Add map and book to the site artifact
        run: uv run python scripts/package_site.py --site-dir site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: deploy-pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
